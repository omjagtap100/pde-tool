<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>PDE Gate — Organisation Settings</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 620px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      box-sizing: border-box;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button + button {
      margin-left: 0.5rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .result {
      margin-top: 2rem;
      padding: 1rem;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 4px;
      display: none;
    }

    .error {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .muted {
      color: #4b5563;
      font-size: 0.95rem;
    }

    .package-fields {
      display: none;
      margin-top: 1.5rem;
    }

    nav a {
      margin-right: 1rem;
    }

    code {
      word-break: break-all;
    }
  </style>

  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <nav>
    <a href="/register">Register</a>
    <a href="/settings">Settings</a>
  </nav>

  <h1>Organisation settings</h1>

  <p class="muted">
    Authenticate using the organisation ID and API key, load an existing
    policy package, and update its policy configuration.
  </p>

  <form id="credentials_form">
    <label for="org_id">Organisation ID</label>

    <input
      id="org_id"
      name="org_id"
      autocomplete="off"
      required
    />

    <label for="api_key">API key</label>

    <input
      id="api_key"
      name="api_key"
      type="password"
      autocomplete="off"
      required
    />

    <button id="load_button" type="submit">
      Load policy packages
    </button>
  </form>

    <form id="package_fields" class="package-fields">
    <label for="package_select">Policy package</label>

    <select id="package_select"></select>

    <label for="package_name">Package name</label>

    <input
      id="package_name"
      name="package_name"
      required
    />

    <label for="approved_regions">
      Approved regions (comma-separated)
    </label>

    <input
      id="approved_regions"
      name="approved_regions"
      required
    />

    <label for="approved_zones">
      Approved zones (comma-separated, optional)
    </label>

    <input
      id="approved_zones"
      name="approved_zones"
    />

    <label for="policy_profile">Policy profile</label>

    <select id="policy_profile" name="policy_profile">
      <option value="full">full</option>
      <option value="baseline">baseline</option>
      <option value="custom">custom</option>
    </select>

    <div id="custom_policies" style="display: none">
      <label for="enabled_policies">Enabled policies</label>

      <textarea
        id="enabled_policies"
        name="enabled_policies"
        rows="6"
        placeholder="google_vpc_access_connector: region, network"
      ></textarea>

      <p class="muted">
        Enter one Terraform resource type per line, followed by policy
        filenames without <code>.rego</code>.
      </p>
    </div>

    <button id="save_button" type="button">
      Save changes
    </button>
  </form>

  <div id="result" class="result" aria-live="polite"></div>

  <script>
    const credentialsForm =
      document.getElementById("credentials_form");

    const loadButton =
      document.getElementById("load_button");

    const saveButton =
      document.getElementById("save_button");

    const packageFields =
      document.getElementById("package_fields");

    const packageSelect =
      document.getElementById("package_select");

    const profile =
      document.getElementById("policy_profile");

    const customPolicies =
      document.getElementById("custom_policies");

    const result =
      document.getElementById("result");

    let loadedPackages = [];
    let loadedPackage = null;

    function getCredentials() {
      return {
        orgId:
          document.getElementById("org_id").value.trim(),

        apiKey:
          document.getElementById("api_key").value.trim()
      };
    }

    function authHeaders(apiKey) {
      return {
        "Authorization": `Bearer ${apiKey}`,
        "Content-Type": "application/json"
      };
    }

    function getPackageId(policyPackage) {
      if (!policyPackage) {
        return "";
      }

      return String(
        policyPackage.package_id ||
        policyPackage.id ||
        ""
      );
    }

    function parseList(raw) {
      return String(raw)
        .split(",")
        .map(value => value.trim())
        .filter(Boolean);
    }

    function parseEnabledPolicies(raw) {
      const output = {};

      const lines = String(raw)
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean);

      for (const line of lines) {
        const separator = line.indexOf(":");

        if (separator < 1) {
          throw new Error(
            "Each custom policy line must use: resource_type: policy1, policy2"
          );
        }

        const resourceType =
          line.slice(0, separator).trim();

        const policies =
          line
            .slice(separator + 1)
            .split(",")
            .map(policy => policy.trim())
            .filter(Boolean);

        if (!policies.length) {
          throw new Error(
            "Add at least one policy for " + resourceType
          );
        }

        output[resourceType] = policies;
      }

      if (!Object.keys(output).length) {
        throw new Error(
          "Add at least one custom policy selection"
        );
      }

      return output;
    }

    function formatEnabledPolicies(enabledPolicies) {
      if (
        !enabledPolicies ||
        typeof enabledPolicies !== "object"
      ) {
        return "";
      }

      return Object.entries(enabledPolicies)
        .filter(([, policies]) => Array.isArray(policies))
        .map(([resourceType, policies]) => {
          return `${resourceType}: ${policies.join(", ")}`;
        })
        .join("\n");
    }

    function getPolicyGroups(policyPackage) {
      const groups = policyPackage?.policy_groups;

      if (
        groups &&
        typeof groups === "object" &&
        !Array.isArray(groups)
      ) {
        return groups;
      }

      return {};
    }

    function getVariables(policyPackage) {
      const variables = policyPackage?.variables;

      if (
        variables &&
        typeof variables === "object" &&
        !Array.isArray(variables)
      ) {
        return variables;
      }

      return {};
    }

    function getProfile(policyPackage) {
      const groups = getPolicyGroups(policyPackage);
      const variables = getVariables(policyPackage);

      if (
        typeof groups.profile === "string" &&
        ["full", "baseline", "custom"].includes(
          groups.profile
        )
      ) {
        return groups.profile;
      }

      if (
        typeof variables.policy_profile === "string" &&
        ["full", "baseline", "custom"].includes(
          variables.policy_profile
        )
      ) {
        return variables.policy_profile;
      }

      const packageName =
        String(policyPackage?.name || "").toLowerCase();

      if (packageName.startsWith("full")) {
        return "full";
      }

      if (packageName.startsWith("custom")) {
        return "custom";
      }

      return "baseline";
    }

    function getEnabledPolicies(policyPackage) {
      const groups = getPolicyGroups(policyPackage);

      if (
        groups.enabled_policies &&
        typeof groups.enabled_policies === "object" &&
        !Array.isArray(groups.enabled_policies)
      ) {
        return groups.enabled_policies;
      }

      const fallback = {};

      for (const [key, value] of Object.entries(groups)) {
        if (
          key !== "profile" &&
          key !== "enabled_policies" &&
          Array.isArray(value)
        ) {
          fallback[key] = value;
        }
      }

      return fallback;
    }

    function toggleCustomPolicies() {
      customPolicies.style.display =
        profile.value === "custom"
          ? "block"
          : "none";
    }

    function showMessage(message) {
      result.className = "result";
      result.innerHTML = "";

      const paragraph = document.createElement("p");
      paragraph.textContent = message;

      result.appendChild(paragraph);
      result.style.display = "block";
    }

    function showError(message) {
      result.className = "result error";
      result.innerHTML = "";

      const heading = document.createElement("h2");
      heading.textContent = "Unable to complete request";

      const paragraph = document.createElement("p");
      paragraph.textContent = message;

      result.appendChild(heading);
      result.appendChild(paragraph);
      result.style.display = "block";
    }

    async function readJson(response) {
      try {
        return await response.json();
      } catch {
        return {};
      }
    }

    function populatePackage(policyPackage) {
      loadedPackage = policyPackage;

      const variables =
        getVariables(policyPackage);

      const selectedProfile =
        getProfile(policyPackage);

      document.getElementById("package_name").value =
        policyPackage.name || "";

      document.getElementById("approved_regions").value =
        Array.isArray(variables.approved_regions)
          ? variables.approved_regions.join(", ")
          : "";

      document.getElementById("approved_zones").value =
        Array.isArray(variables.approved_zones)
          ? variables.approved_zones.join(", ")
          : "";

      profile.value = selectedProfile;

      document.getElementById("enabled_policies").value =
        formatEnabledPolicies(
          getEnabledPolicies(policyPackage)
        );

      toggleCustomPolicies();
      packageFields.style.display = "block";
    }

    function populatePackageSelector(packages) {
      packageSelect.innerHTML = "";

      for (const policyPackage of packages) {
        const option =
          document.createElement("option");

        option.value =
          getPackageId(policyPackage);

        option.textContent =
          policyPackage.name ||
          getPackageId(policyPackage);

        packageSelect.appendChild(option);
      }

      if (packages.length) {
        packageSelect.value =
          getPackageId(packages[0]);

        populatePackage(packages[0]);
      }
    }

    async function loadPackages() {
      const { orgId, apiKey } =
        getCredentials();

      if (!orgId || !apiKey) {
        throw new Error(
          "Organisation ID and API key are required"
        );
      }

      const response = await fetch(
        `/v1/orgs/${encodeURIComponent(orgId)}/packages`,
        {
          headers: authHeaders(apiKey)
        }
      );

      const data = await readJson(response);

      if (!response.ok) {
        throw new Error(
          data.error ||
          "Unable to load policy packages"
        );
      }

      loadedPackages =
        Array.isArray(data.packages)
          ? data.packages
          : [];

      if (!loadedPackages.length) {
        loadedPackage = null;
        packageFields.style.display = "none";

        throw new Error(
          "No policy packages were found for this organisation"
        );
      }

      populatePackageSelector(loadedPackages);

      showMessage(
        `Loaded ${loadedPackages.length} policy package` +
        `${loadedPackages.length === 1 ? "" : "s"}.`
      );
    }

    credentialsForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        result.style.display = "none";
        loadButton.disabled = true;
        loadButton.textContent = "Loading...";

        try {
          await loadPackages();
        } catch (error) {
          showError(
            error instanceof Error
              ? error.message
              : "Unable to load policy packages"
          );
        } finally {
          loadButton.disabled = false;
          loadButton.textContent =
            "Load policy packages";
        }
      }
    );

    packageSelect.addEventListener(
      "change",
      () => {
        const selectedPackage =
          loadedPackages.find(policyPackage => {
            return (
              getPackageId(policyPackage) ===
              packageSelect.value
            );
          });

        if (selectedPackage) {
          populatePackage(selectedPackage);
          result.style.display = "none";
        }
      }
    );

    profile.addEventListener(
      "change",
      toggleCustomPolicies
    );

    saveButton.addEventListener(
      "click",
      async () => {
        if (!loadedPackage) {
          showError(
            "Load a policy package before saving changes"
          );
          return;
        }

        const { orgId, apiKey } =
          getCredentials();

        const packageId =
          getPackageId(loadedPackage);

        const packageName =
          document
            .getElementById("package_name")
            .value
            .trim();

        if (!packageName) {
          showError("Package name is required");
          return;
        }

        const selectedProfile =
          profile.value;

        let enabledPolicies = {};

        if (selectedProfile === "custom") {
          try {
            enabledPolicies =
              parseEnabledPolicies(
                document
                  .getElementById("enabled_policies")
                  .value
              );
          } catch (error) {
            showError(
              error instanceof Error
                ? error.message
                : "Invalid custom policy configuration"
            );
            return;
          }
        }

        const existingVariables =
          getVariables(loadedPackage);

        const requestBody = {
          name: packageName,

          description:
            `Updated ${selectedProfile} policy configuration`,

          platforms:
            Array.isArray(loadedPackage.platforms) &&
            loadedPackage.platforms.length
              ? loadedPackage.platforms
              : ["gcp"],

          policy_groups: {
            profile: selectedProfile,
            enabled_policies: enabledPolicies
          },

          variables: {
            ...existingVariables,

            approved_regions:
              parseList(
                document
                  .getElementById("approved_regions")
                  .value
              ),

            approved_zones:
              parseList(
                document
                  .getElementById("approved_zones")
                  .value
              )
          }
        };

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {
          const response = await fetch(
            `/v1/orgs/${encodeURIComponent(orgId)}` +
            `/packages/${encodeURIComponent(packageId)}`,
            {
              method: "PATCH",
              headers: authHeaders(apiKey),
              body: JSON.stringify(requestBody)
            }
          );

          const updatedPackage =
            await readJson(response);

          if (!response.ok) {
            throw new Error(
              updatedPackage.error ||
              "Unable to save policy package"
            );
          }

          loadedPackage = updatedPackage;

          loadedPackages =
            loadedPackages.map(policyPackage => {
              return (
                getPackageId(policyPackage) === packageId
                  ? updatedPackage
                  : policyPackage
              );
            });

          populatePackageSelector(loadedPackages);

          packageSelect.value =
            getPackageId(updatedPackage);

          populatePackage(updatedPackage);

          showMessage(
            "Policy package settings saved successfully. " +
            "The updated configuration will apply to the next PDE Gate check."
          );
        } catch (error) {
          showError(
            error instanceof Error
              ? error.message
              : "Unable to save policy package"
          );
        } finally {
          saveButton.disabled = false;
          saveButton.textContent = "Save changes";
        }
      }
    );
  </script>
</body>
</html>
